{% extends "base.html" %}

{% block title %}Erreur serveur - RD Ménage{% endblock %}

{% block content %}
<div class="error-container">
    <div class="container">
        <div class="error-content">
            <div class="error-code">500</div>
            <h1>Erreur serveur</h1>
            <p>Une erreur inattendue s'est produite. Nos équipes travaillent à résoudre le problème.</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Retour à l'accueil</a>
                <a href="/contact" class="btn btn-outline">Nous contacter</a>
            </div>
        </div>
    </div>
</div>

<style>
.error-container {
    padding: 4rem 0;
    text-align: center;
    min-height: 60vh;
    display: flex;
    align-items: center;
}

.error-content {
    max-width: 600px;
    margin: 0 auto;
}

.error-code {
    font-size: 8rem;
    font-weight: 700;
    color: var(--danger);
    line-height: 1;
    margin-bottom: 1rem;
}

.error-content h1 {
    font-size: 2rem;
    color: var(--text-primary);
    margin-bottom: 1rem;
}

.error-content p {
    font-size: 1.1rem;
    color: var(--text-secondary);
    margin-bottom: 2rem;
}

.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}

@media (max-width: 768px) {
    .error-code {
        font-size: 6rem;
    }
    
    .error-content h1 {
        font-size: 1.5rem;
    }
    
    .error-actions {
        flex-direction: column;
        align-items: center;
    }
    
    .btn {
        width: 200px;
    }
}
</style>
{% endblock %}
